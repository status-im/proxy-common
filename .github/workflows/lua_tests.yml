name: Lua Tests

on:
  push:
    branches: [ master ]
    paths:
      - 'auth/nginx/**'
      - '.github/workflows/lua_tests.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
    paths:
      - 'auth/nginx/**'
      - '.github/workflows/lua_tests.yml'

jobs:
  lua-tests:
    name: Run Lua Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    # OpenResty runs LuaJIT, which is Lua 5.1
    - name: Install Lua 5.1 and LuaRocks
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks

    - name: Install Lua dependencies
      run: |
        sudo luarocks --lua-version=5.1 install busted
        sudo luarocks --lua-version=5.1 install lua-cjson

    - name: Run Lua tests
      run: |
        cd auth/nginx
        ./lua_tests/run_busted_tests.sh
