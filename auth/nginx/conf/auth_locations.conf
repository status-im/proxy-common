# Puzzle auth locations. Include inside the server block:
#
#     include auth_locations.conf;
#
# and protect a location with a token (optionally: OR basic auth):
#
#     satisfy any;
#     auth_basic           "Restricted";
#     auth_basic_user_file /etc/nginx/.htpasswd;
#     auth_request         /_auth_token;
#
# Needs in the http block: lua_package_path with the lua/ directory of this
# module, `lua_shared_dict jwt_tokens 10m;` and auth.auth_config's init() in
# init_worker_by_lua, and the zone /auth/solve is limited by, keyed by what
# tells the proxy's clients apart:
#
#     limit_req_zone $binary_remote_addr zone=auth_solve:10m rate=10r/s;
#
# See ../README.md.

# Auth endpoints - no authentication required, handled by the auth service
location /auth/ {
    set_by_lua_block $go_auth_service_url {
        local auth_config = require("auth.auth_config")
        return auth_config.get_go_auth_service_url()
    }
    proxy_pass $go_auth_service_url;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A wrong answer to a real puzzle costs the auth service one Argon2 run, so the
# rate of answers is limited per client.
location = /auth/solve {
    limit_req zone=auth_solve burst=20 nodelay;
    limit_req_status 429;

    set_by_lua_block $go_auth_service_url {
        local auth_config = require("auth.auth_config")
        return auth_config.get_go_auth_service_url()
    }
    proxy_pass $go_auth_service_url;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Internal auth endpoint for JWT token validation (hybrid Lua + Go)
location = /_auth_token {
    internal;
    content_by_lua_file lua/auth/auth_token_validator.lua;
}

# Internal endpoint for Go service validation (called by Lua)
location = /_auth_go_verify {
    internal;
    set_by_lua_block $go_auth_service_url {
        local auth_config = require("auth.auth_config")
        return auth_config.get_go_auth_service_url()
    }
    # Pass original query string to auth service for JWT token extraction
    proxy_pass $go_auth_service_url/auth/verify?$args;
    # Verifying a token is a signature check: an auth service that takes
    # longer is down, and must not hold client connections.
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
}
